name: FinBot hourly

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 (avoid the crowded :00 slot)
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Persist the SQLite DB between runs so dedup + "what's new" work
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: finbot.db
          key: finbot-db-${{ github.run_id }}
          restore-keys: finbot-db-

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run hourly crawl + notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py hourly

      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: finbot.db
          key: finbot-db-${{ github.run_id }}
