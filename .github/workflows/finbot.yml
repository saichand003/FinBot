name: FinBot hourly

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 (avoid the crowded :00 slot)
  workflow_dispatch:        # manual "Run workflow" button

# Pages permissions let the job publish the dashboard; the notification links to it.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two runs publish at once, but let a running crawl finish.
concurrency:
  group: finbot
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Persist the SQLite DB between runs so dedup and "what's new" work
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: finbot.db
          key: finbot-db-${{ github.run_id }}
          restore-keys: finbot-db-

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Crawl, analyse, build dashboard, notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # The dashboard is published to Pages; the push notification links here.
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python main.py hourly

      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: finbot.db
          key: finbot-db-${{ github.run_id }}

      - name: Package the dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
